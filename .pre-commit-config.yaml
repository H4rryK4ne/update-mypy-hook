default_install_hook_types:
- pre-commit
- post-checkout
- post-merge
- post-rewrite
repos:
- repo: .
  rev: v0.3.1  # set to current commit for interactive development
  hooks:
  - id: update-mypy-hook
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args:
    - --maxkb=800
  - id: trailing-whitespace
  - id: end-of-file-fixer
    exclude: .idea
  - id: check-json
    exclude: .vscode
  - id: check-toml
  - id: check-xml
  - id: check-yaml
  - id: debug-statements
  - id: check-builtin-literals
  - id: check-case-conflict
  - id: check-docstring-first
  - id: detect-private-key
  - id: check-added-large-files
  - id: check-merge-conflict
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.20.1
  hooks:
  - id: mypy
    verbose: true
    args:
    - --config-file=pyproject.toml
    additional_dependencies:
    - librt==0.9.0 ; platform_python_implementation != 'PyPy'
    - pathspec==1.0.4
    - ruamel-yaml==0.19.1
    - uv==0.11.6
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.10
  hooks:
  - id: ruff-check
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.6
  hooks:
  - id: uv-lock
  - id: uv-sync
    args:
    - --locked
  - id: uv-export
    alias: uv-export-prod
    args:
    - --no-default-groups
    - --no-hashes
    - --no-editable
    - --no-header
    - -o=requirements.txt
  - id: uv-export
    alias: uv-export-dev
    args:
    - --no-hashes
    - --no-editable
    - --no-header
    - -o=requirements.dev
